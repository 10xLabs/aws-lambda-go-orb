version: 2.1
setup: true

orbs:
  orb-tools: circleci/orb-tools@12.5.0
  bats: circleci/bats@1.1.0
  shellcheck: circleci/shellcheck@3.4.0

filters: &filters
  tags:
    only: /.*/

workflows:
  # Step 1 of the Orb Development Kit: static checks and unit tests, none of
  # which need publishing credentials. Runs on every commit and every tag.
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/review:
          orb_name: aws-lambda-go
          # RC010 asks for snake_cased component file names. Renaming them would
          # rename this orb's public jobs and commands (lint-code -> lint_code,
          # install-pulumi-deps -> install_pulumi_deps, ...) and break every
          # consumer pinned to a 3.x version. Revisit on the next major.
          exclude: RC010
          filters: *filters
      - orb-tools/pack:
          # orb-tools/pack validates the packed orb through the CircleCI API. Its
          # script falls back to CIRCLE_TOKEN=dummy outside self-hosted CircleCI,
          # but that fallback is rejected on Cloud for this project: without a
          # context the job fails with "failure calling GraphQL API: 401
          # Unauthorized" (reproduced on jobs 3345 and 3406). A project-level
          # CIRCLE_TOKEN exists but is not accepted, and context values take
          # precedence over project ones, so the context is what supplies a
          # working token. Narrowing this to a read-only context would be a
          # genuine improvement; removing it outright breaks the job.
          context: orb-publishing
          filters: *filters
      - shellcheck/check:
          dir: ./src/scripts
          exclude: SC2148
          filters: *filters
      - bats/run:
          path: ./src/tests
          filters: *filters
      # A development version, published from every branch, so a consumer
      # repository can test a change before it is released by pinning
      # nexbus/aws-lambda-go@dev:alpha in its own config.
      #
      # Both tags are published. dev:alpha tracks the most recent branch build,
      # which is what makes the push-a-branch-then-test loop work without
      # touching the consumer's config. dev:<sha> is the deterministic pin to
      # use when two branches are in flight and dev:alpha would be ambiguous.
      #
      # There is no tag filter, so this runs on branches only: a release tag
      # publishes a production version through test-deploy.yml instead.
      - orb-tools/publish:
          name: publish-dev
          orb_name: nexbus/aws-lambda-go
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          dev_tags: dev:${CIRCLE_SHA1},dev:alpha
          enable_pr_comment: false
          context: orb-publishing
          requires:
            - orb-tools/lint
            - orb-tools/review
            - orb-tools/pack
            - shellcheck/check
            - bats/run
      # Injects this commit's orb source into .circleci/test-deploy.yml and
      # continues the pipeline, so this repository's own integration tests need
      # no published version to run against.
      - orb-tools/continue:
          # Reference name only, no namespace: this is the key under "orbs" in
          # test-deploy.yml that the packed orb source gets injected into.
          # Passing "nexbus/aws-lambda-go" here matches no key, so nothing is
          # injected and every aws-lambda-go/* step fails to resolve.
          orb_name: aws-lambda-go
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          requires:
            - orb-tools/lint
            - orb-tools/review
            - orb-tools/pack
            - shellcheck/check
            - bats/run
          filters: *filters
