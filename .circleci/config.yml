version: 2.1
setup: true

orbs:
  orb-tools: circleci/orb-tools@12.5.0
  bats: circleci/bats@1.1.0
  shellcheck: circleci/shellcheck@3.4.0

filters: &filters
  tags:
    only: /.*/

workflows:
  # Step 1 of the Orb Development Kit: static checks and unit tests, none of
  # which need publishing credentials. Runs on every commit and every tag.
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/review:
          orb_name: aws-lambda-go
          # RC010 asks for snake_cased component file names. Renaming them would
          # rename this orb's public jobs and commands (lint-code -> lint_code,
          # install-pulumi-deps -> install_pulumi_deps, ...) and break every
          # consumer pinned to a 3.x version. Revisit on the next major.
          exclude: RC010
          filters: *filters
      - orb-tools/pack:
          # orb-tools/pack runs "circleci orb validate --token $CIRCLE_TOKEN",
          # so it needs the publishing credentials even though it publishes
          # nothing. The other step 1 jobs, continue included, do not.
          context: orb-publishing
          filters: *filters
      - shellcheck/check:
          dir: ./src/scripts
          exclude: SC2148
          filters: *filters
      - bats/run:
          path: ./src/tests
          filters: *filters
      # Injects this commit's orb source into .circleci/test-deploy.yml and
      # continues the pipeline, so the integration tests exercise the orb as if
      # it were published. No development version is published: nothing outside
      # this repository consumes dev orbs.
      - orb-tools/continue:
          orb_name: nexbus/aws-lambda-go
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          requires:
            - orb-tools/lint
            - orb-tools/review
            - orb-tools/pack
            - shellcheck/check
            - bats/run
          filters: *filters
