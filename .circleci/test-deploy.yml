version: 2.1

orbs:
  # Intentionally unversioned: the "continue" job in config.yml injects this
  # commit's orb source into this config, so the integration tests below run
  # against the working tree rather than a published version.
  aws-lambda-go: {}
  orb-tools: circleci/orb-tools@12.5.0

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

# Every job below runs on one of the orb's own executors, so the tests cover the
# executor definitions themselves and not just the scripts.
jobs:
  # Exercises the build command end to end (build.sh, then package.sh) against a
  # throwaway vendored Go module, and asserts the artifact really is a Linux
  # binary for the requested architecture rather than merely a file that exists.
  integration-test-build:
    parameters:
      architecture:
        description: Value passed through to the build command's build-architecture.
        type: string
      elf-machine:
        description: >
          Expected ELF e_machine field (offset 0x12, little endian) for the
          architecture above: 3e00 for x86-64, b700 for aarch64. Asserting on it
          proves the architecture reached the compiler.
        type: string
    executor: aws-lambda-go/golang
    steps:
      - run:
          name: Scaffold a vendored Go Lambda project
          command: |
            mkdir -p vendor
            printf 'module example.com/orb-integration-fixture\n\ngo 1.26\n' > go.mod
            : > vendor/modules.txt
            printf 'package main\n\nimport "fmt"\n\nfunc main() {\n\tfmt.Println("aws-lambda-go orb integration fixture")\n}\n' > main.go
      - aws-lambda-go/build:
          build-input-file: main.go
          # Both output paths are unique per architecture: the build command
          # persists the binary and the archive to the workspace, and
          # orb-tools/publish attaches the layers of every job it requires, so a
          # path shared between two builds fails the publish job with
          # "Concurrent upstream jobs persisted the same file(s)".
          build-output-file: build/<< parameters.architecture >>/main
          build-architecture: << parameters.architecture >>
          package-output-file: deploy/lambda-<< parameters.architecture >>.zip
      - run:
          name: Verify the packaged artifact
          command: |
            PACKAGE="deploy/lambda-<< parameters.architecture >>.zip"
            BINARY="build/<< parameters.architecture >>/main"
            test -f "$PACKAGE"
            # zip -sf, not unzip: the orb already requires zip, unzip is not guaranteed.
            zip -sf "$PACKAGE" | grep -Eq '^[[:space:]]+main$'
            ELF_MAGIC=$(head -c 4 "$BINARY" | od -An -tx1 | tr -d ' \n')
            test "$ELF_MAGIC" = 7f454c46
            ELF_MACHINE=$(dd if="$BINARY" bs=1 skip=18 count=2 2>/dev/null | od -An -tx1 | tr -d ' \n')
            test "$ELF_MACHINE" = "<< parameters.elf-machine >>"

  # The output directory is deliberately absent here: consumers are not required
  # to commit deploy/, and package.sh has to create it before resolving the path.
  integration-test-build-nested-output:
    executor: aws-lambda-go/golang
    steps:
      - run:
          name: Scaffold a vendored Go Lambda project in a subdirectory
          command: |
            mkdir -p cmd/lambda vendor
            printf 'module example.com/orb-integration-fixture\n\ngo 1.26\n' > go.mod
            : > vendor/modules.txt
            printf 'package main\n\nfunc main() {}\n' > cmd/lambda/main.go
      - aws-lambda-go/build:
          build-input-file: cmd/lambda/main.go
          build-output-file: build/bin/main
          package-output-file: dist/nested/lambda.zip
      - run:
          name: Verify the archive stores the binary at its root
          command: |
            test -f dist/nested/lambda.zip
            zip -sf dist/nested/lambda.zip | grep -Eq '^[[:space:]]+main$'
            ! zip -sf dist/nested/lambda.zip | grep -q 'build/bin'

  # The Go build cache is keyed on a checksum of vendor/modules.txt, and
  # {{ checksum }} on a missing file fails the job outright. A project that does
  # not vendor has to be able to opt out, so this fixture deliberately omits the
  # vendor directory and asserts the build still succeeds.
  integration-test-build-without-vendor:
    executor: aws-lambda-go/golang
    steps:
      - run:
          name: Scaffold a Go project with no vendor directory
          command: |
            printf 'module example.com/orb-integration-fixture\n\ngo 1.26\n' > go.mod
            printf 'package main\n\nfunc main() {}\n' > main.go
            test ! -e vendor/modules.txt
      - aws-lambda-go/build:
          cache-go-build: false
          build-input-file: main.go
          # Not "main": see the note on integration-test-build. The workspace
          # paths must be unique across every job orb-tools/publish requires.
          build-output-file: build/novendor/main
          package-output-file: deploy/lambda.zip
      - run:
          name: Verify the artifact was produced without any cache step
          command: |
            test -f deploy/lambda.zip
            zip -sf deploy/lambda.zip | grep -Eq '^[[:space:]]+main$'

  # Covers the three scripts behind the test command: test.sh, which uses the
  # gotestsum the Go convenience image ships, export_coverage.sh, which uses
  # "go tool cover", and check_coverage.sh, which re-runs "go test -cover".
  integration-test-test:
    executor: aws-lambda-go/golang
    steps:
      - run:
          name: Scaffold a vendored Go module with a covering test
          command: |
            mkdir -p vendor
            printf 'module example.com/orb-integration-fixture\n\ngo 1.26\n' > go.mod
            : > vendor/modules.txt
            printf 'package fixture\n\nfunc Add(a, b int) int {\n\treturn a + b\n}\n' > fixture.go
            printf 'package fixture\n\nimport "testing"\n\nfunc TestAdd(t *testing.T) {\n\tif Add(1, 2) != 3 {\n\t\tt.Fatal("Add did not add")\n\t}\n}\n' > fixture_test.go
      - aws-lambda-go/test:
          minimum-coverage: "50.00"
      - run:
          name: Verify the reports the test command is documented to store
          command: |
            test -f /tmp/test_results/unit-tests.xml
            test -f /tmp/artifacts/coverage.html
            grep -q 'TestAdd' /tmp/test_results/unit-tests.xml

  # golangci-lint is preinstalled in the Go image; this also pins down that the
  # bundled major version reads a v2 configuration.
  integration-test-lint-code:
    executor: aws-lambda-go/golang
    steps:
      - run:
          name: Scaffold a Go module with a golangci-lint v2 config
          command: |
            mkdir -p vendor
            printf 'module example.com/orb-integration-fixture\n\ngo 1.26\n' > go.mod
            : > vendor/modules.txt
            printf 'package fixture\n\nfunc Add(a, b int) int {\n\treturn a + b\n}\n' > fixture.go
            printf 'version: "2"\n' > .golangci.yml
      - aws-lambda-go/lint-code

  # The three tools the convenience images do not carry. Each install command is
  # asserted to put the expected version on the PATH for later steps.
  integration-test-install-pulumi-cli:
    executor: aws-lambda-go/node
    steps:
      - aws-lambda-go/install-pulumi-cli
      - run:
          name: Verify Pulumi is on the PATH
          command: pulumi version | grep -Eq '^v3\.'

  integration-test-install-github-cli:
    executor: aws-lambda-go/base
    steps:
      - aws-lambda-go/install-github-cli
      - run:
          name: Verify the GitHub CLI is on the PATH
          command: gh --version | grep -q 'gh version 2\.'

  integration-test-install-commitlint:
    executor: aws-lambda-go/node
    steps:
      - aws-lambda-go/install-commitlint
      - run:
          name: Verify commitlint accepts a conventional subject and rejects a bad one
          command: |
            echo "module.exports = {extends: ['@commitlint/config-conventional']}" > commitlint.config.js
            echo "feat: a conventional subject" | npx commitlint
            ! echo "not conventional at all" | npx commitlint

workflows:
  # Step 2 of the Orb Development Kit: integration tests against the injected
  # orb source, then a production release when a vX.Y.Z tag is pushed.
  test-deploy:
    jobs:
      - integration-test-build:
          name: integration-test-build-amd64
          architecture: amd64
          elf-machine: "3e00"
          filters: *filters
      - integration-test-build:
          name: integration-test-build-arm64
          architecture: arm64
          elf-machine: "b700"
          filters: *filters
      - integration-test-build-nested-output:
          filters: *filters
      - integration-test-build-without-vendor:
          filters: *filters
      - integration-test-test:
          filters: *filters
      - integration-test-lint-code:
          filters: *filters
      - integration-test-install-pulumi-cli:
          filters: *filters
      - integration-test-install-github-cli:
          filters: *filters
      - integration-test-install-commitlint:
          filters: *filters
      - orb-tools/pack:
          # Needs a working CIRCLE_TOKEN to validate; see the note in config.yml.
          context: orb-publishing
          filters: *release-filters
      - orb-tools/publish:
          orb_name: nexbus/aws-lambda-go
          vcs_type: << pipeline.project.type >>
          pub_type: production
          enable_pr_comment: false
          context: orb-publishing
          requires:
            - orb-tools/pack
            - integration-test-build-amd64
            - integration-test-build-arm64
            - integration-test-build-nested-output
            - integration-test-build-without-vendor
            - integration-test-test
            - integration-test-lint-code
            - integration-test-install-pulumi-cli
            - integration-test-install-github-cli
            - integration-test-install-commitlint
          filters: *release-filters
