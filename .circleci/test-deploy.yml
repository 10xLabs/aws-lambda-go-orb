version: 2.1

orbs:
  # Intentionally unversioned: the "continue" job in config.yml injects this
  # commit's orb source into this config, so the integration tests below run
  # against the working tree rather than a published version.
  aws-lambda-go: {}
  orb-tools: circleci/orb-tools@12.5.0

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Exercises the build command end to end (build.sh, then package.sh) against a
  # throwaway vendored Go module, and asserts the artifact really is a Linux
  # binary for the requested architecture rather than merely a file that exists.
  integration-test-build:
    parameters:
      architecture:
        description: Value passed through to the build command's build-architecture.
        type: string
      elf-machine:
        description: >
          Expected ELF e_machine field (offset 0x12, little endian) for the
          architecture above: 3e00 for x86-64, b700 for aarch64. Asserting on it
          proves the architecture reached the compiler.
        type: string
    docker:
      - image: cimg/go:1.22
    steps:
      - run:
          name: Scaffold a vendored Go Lambda project
          command: |
            mkdir -p vendor
            printf 'module example.com/orb-integration-fixture\n\ngo 1.22\n' > go.mod
            : > vendor/modules.txt
            printf 'package main\n\nimport "fmt"\n\nfunc main() {\n\tfmt.Println("aws-lambda-go orb integration fixture")\n}\n' > main.go
      - aws-lambda-go/build:
          build-input-file: main.go
          build-output-file: main
          build-architecture: << parameters.architecture >>
          package-output-file: deploy/lambda.zip
      - run:
          name: Verify the packaged artifact
          command: |
            test -f deploy/lambda.zip
            # zip -sf, not unzip: the orb already requires zip, unzip is not guaranteed.
            zip -sf deploy/lambda.zip | grep -Eq '^[[:space:]]+main$'
            ELF_MAGIC=$(head -c 4 main | od -An -tx1 | tr -d ' \n')
            test "$ELF_MAGIC" = 7f454c46
            ELF_MACHINE=$(dd if=main bs=1 skip=18 count=2 2>/dev/null | od -An -tx1 | tr -d ' \n')
            test "$ELF_MACHINE" = "<< parameters.elf-machine >>"

  # The output directory is deliberately absent here: consumers are not required
  # to commit deploy/, and package.sh has to create it before resolving the path.
  integration-test-build-nested-output:
    docker:
      - image: cimg/go:1.22
    steps:
      - run:
          name: Scaffold a vendored Go Lambda project in a subdirectory
          command: |
            mkdir -p cmd/lambda vendor
            printf 'module example.com/orb-integration-fixture\n\ngo 1.22\n' > go.mod
            : > vendor/modules.txt
            printf 'package main\n\nfunc main() {}\n' > cmd/lambda/main.go
      - aws-lambda-go/build:
          build-input-file: cmd/lambda/main.go
          build-output-file: build/bin/main
          package-output-file: dist/nested/lambda.zip
      - run:
          name: Verify the archive stores the binary at its root
          command: |
            test -f dist/nested/lambda.zip
            zip -sf dist/nested/lambda.zip | grep -Eq '^[[:space:]]+main$'
            ! zip -sf dist/nested/lambda.zip | grep -q 'build/bin'

workflows:
  # Step 2 of the Orb Development Kit: integration tests against the injected
  # orb source, then a production release when a vX.Y.Z tag is pushed.
  test-deploy:
    jobs:
      - integration-test-build:
          name: integration-test-build-amd64
          architecture: amd64
          elf-machine: "3e00"
          filters: *filters
      - integration-test-build:
          name: integration-test-build-arm64
          architecture: arm64
          elf-machine: "b700"
          filters: *filters
      - integration-test-build-nested-output:
          filters: *filters
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: nexbus/aws-lambda-go
          vcs_type: << pipeline.project.type >>
          pub_type: production
          enable_pr_comment: false
          context: orb-publishing
          requires:
            - orb-tools/pack
            - integration-test-build-amd64
            - integration-test-build-arm64
            - integration-test-build-nested-output
          filters: *release-filters
