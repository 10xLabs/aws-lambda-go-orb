description: >
  Executor for jobs that compile, test, lint or document Go code.
  The CircleCI Go convenience image already ships gotestsum, golangci-lint,
  zip, jq and git, so these jobs need no install steps.
docker:
  - image: "cimg/go:<< parameters.tag >>"
resource_class: arm.medium
parameters:
  tag:
    default: "1.26.7"
    description: >
      Pick a specific Go image variant:
      https://hub.docker.com/r/cimg/go
      Keep this an exact patch version -- a floating tag silently changes the
      compiler, and with it the bytes of every binary built here.
    type: string
