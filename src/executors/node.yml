description: >
  Executor for jobs that drive Node tooling: the Pulumi programs used by
  deploy and preview, and the commitlint run used by lint-commits.
docker:
  - image: "cimg/node:<< parameters.tag >>"
resource_class: arm.medium
parameters:
  tag:
    default: "22.20.0"
    description: >
      Pick a specific node image variant:
      https://hub.docker.com/r/cimg/node
    type: string
