description: >
  This command run the AWS Lambda Go function tests

parameters:
  results-folder:
    type: string
    default: /tmp/test_results
  minimum-coverage:
    type: string
    default: "50.00"
  artifacts-folder:
    type: string
    default: /tmp/artifacts
  cache-go-build:
    description: >
      Cache the Go build cache between jobs. Every job otherwise starts with a
      cold cache and recompiles the whole dependency tree.
      Disable it for a project that does not vendor its dependencies, because
      the cache key is a checksum of the file named by go-cache-key-file and a
      missing file fails the job.
    type: boolean
    default: true
  go-cache-key-file:
    description: >
      File whose checksum keys the Go build cache. Keying on the dependency
      manifest rather than the commit means the cache is rewritten only when
      dependencies change.
    type: string
    default: vendor/modules.txt

steps:
  - when:
      condition: << parameters.cache-go-build >>
      steps:
        - restore_cache:
            name: Restore Go build cache
            keys:
              # Shared with the other native-compiling command (lint and test
              # both build for the host), which is deliberate: whichever runs
              # first warms the cache for the other. The build command uses a
              # separate key because it cross-compiles for a different target.
              - go-host-v1-{{ arch }}-{{ checksum "<< parameters.go-cache-key-file >>" }}
              - go-host-v1-{{ arch }}-
  - run:
      name: Run tests
      environment:
        RESULTS_FOLDER: << parameters.results-folder >>
      command: << include(scripts/test.sh) >>
  - store_test_results:
      name: Store tests results
      path: << parameters.results-folder >>
  - run:
      name: Export tests coverage
      environment:
        ARTIFACTS_FOLDER: << parameters.artifacts-folder >>
      command: << include(scripts/export_coverage.sh) >>
  - store_artifacts:
      name: Store tests coverage
      path: << parameters.artifacts-folder >>
  - run:
      name: Check tests coverage
      environment:
        MINIMUM_COVERAGE: << parameters.minimum-coverage >>
      command: << include(scripts/check_coverage.sh) >>
  - when:
      condition: << parameters.cache-go-build >>
      steps:
        - save_cache:
            name: Store Go build cache
            key: go-host-v1-{{ arch }}-{{ checksum "<< parameters.go-cache-key-file >>" }}
            paths:
              - ~/.cache/go-build
