description: >
  This command create a preview of the Pulumi stack changes

parameters:
  working-directory:
    type: string
    default: deploy
  stack-name:
    type: string
    default: ""
  install-pulumi-deps:
    type: boolean
    default: true
  setup-remote-docker:
    type: boolean
    default: false
  allow-destroy:
    description: >
      Let the preview pass when the plan deletes or replaces existing resources.
      Off by default: a deletion discards whatever the resource holds, and it is
      easy to miss in a long plan.
    type: boolean
    default: false

steps:
  - attach_workspace:
      at: .
  - install-pulumi-cli
  - run:
      name: Set stack name
      environment:
        STACK_NAME: << parameters.stack-name >>
      command: << include(scripts/set_stack_name.sh) >>
  - run:
      name: Print Pulumi version
      command: pulumi version
  - when:
      condition:
        equal: [true, << parameters.install-pulumi-deps >>]
      steps:
        - restore_cache:
            keys:
              - yarn-packages-{{ checksum "<< parameters.working-directory >>/yarn.lock" }}
              - yarn-packages-
        - run:
            name: Install Pulumi Dependencies
            environment:
              WORKING_DIRECTORY: << parameters.working-directory >>
            command: << include(scripts/install_pulumi_deps.sh) >>
        - save_cache:
            key: yarn-packages-{{ checksum "<< parameters.working-directory >>/yarn.lock" }}
            paths:
              - ~/.cache/yarn
  - when:
      condition:
        equal: [true, << parameters.setup-remote-docker >>]
      steps:
        - setup_remote_docker:
            version: default
            docker_layer_caching: true
  - run:
      name: Pulumi preview
      environment:
        WORKING_DIRECTORY: << parameters.working-directory >>
        ALLOW_DESTROY: << parameters.allow-destroy >>
      command: << include(scripts/pulumi_preview.sh) >>
