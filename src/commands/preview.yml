description: >
  This command create a preview of the Pulumi stack changes

parameters:
  working-directory:
    type: string
    default: deploy
  stack-name:
    type: string
    default: ""
  install-pulumi-deps:
    type: boolean
    default: true
  setup-remote-docker:
    type: boolean
    default: false

steps:
  - attach_workspace:
      at: .
  - install-pulumi-cli
  - run:
      name: Set stack name
      environment:
        STACK_NAME: << parameters.stack-name >>
      command: << include(scripts/set_stack_name.sh) >>
  - run:
      name: Print Pulumi version
      command: pulumi version
  - when:
      condition:
        equal: [true, << parameters.install-pulumi-deps >>]
      steps:
        - restore_cache:
            keys:
              - yarn-packages-{{ checksum "<< parameters.working-directory >>/yarn.lock" }}
              - yarn-packages-
        - run:
            name: Install Pulumi Dependencies
            environment:
              WORKING_DIRECTORY: << parameters.working-directory >>
            command: << include(scripts/install_pulumi_deps.sh) >>
        - save_cache:
            key: yarn-packages-{{ checksum "<< parameters.working-directory >>/yarn.lock" }}
            paths:
              - ~/.cache/yarn
  - when:
      condition:
        equal: [true, << parameters.setup-remote-docker >>]
      steps:
        - setup_remote_docker:
            version: default
            docker_layer_caching: true
  # Pulumi downloads its provider plugins on first use and they are large: a
  # program pulling aws, awsx, docker and mongodbatlas re-fetches all of them on
  # every run otherwise. install-pulumi-cli caches ~/.pulumi, but it saves
  # before this step runs, so the plugins are never in that archive.
  # Keyed on the lockfile, since the plugin versions come from the program's
  # own dependencies.
  - restore_cache:
      name: Restore Pulumi plugins
      keys:
        - pulumi-plugins-v1-{{ arch }}-{{ checksum "<< parameters.working-directory >>/yarn.lock" }}
        - pulumi-plugins-v1-{{ arch }}-
  - run:
      name: Pulumi preview
      environment:
        WORKING_DIRECTORY: << parameters.working-directory >>
      command: << include(scripts/pulumi_preview.sh) >>
  - save_cache:
      name: Store Pulumi plugins
      key: pulumi-plugins-v1-{{ arch }}-{{ checksum "<< parameters.working-directory >>/yarn.lock" }}
      paths:
        - ~/.pulumi/plugins
