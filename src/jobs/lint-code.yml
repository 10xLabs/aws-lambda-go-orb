description: >
  This lint the code using the defined golangci-lint config

executor: << parameters.executor >>
resource_class: xlarge
parameters:
  executor:
    description: >
      Executor this job runs on. Override it to pin a different image tag, for
      example a specific Go or Node version.
    type: executor
    default: golang
  cache-go-build:
    description: Cache the Go build and golangci-lint caches between jobs. Disable for a project that does not vendor.
    type: boolean
    default: true
  go-cache-key-file:
    description: File whose checksum keys the caches.
    type: string
    default: vendor/modules.txt

steps:
  - checkout
  - lint-code:
      cache-go-build: << parameters.cache-go-build >>
      go-cache-key-file: << parameters.go-cache-key-file >>
  - notify:
      event: fail
      template: basic_fail_1
