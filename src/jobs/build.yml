description: >
  This job build the AWS Lambda Go function executable

executor: << parameters.executor >>
resource_class: xlarge
parameters:
  executor:
    description: >
      Executor this job runs on. Override it to pin a different image tag, for
      example a specific Go or Node version.
    type: executor
    default: golang
  build-input-file:
    type: string
    default: main.go
  build-output-file:
    type: string
    default: main
  build-architecture:
    type: string
    default: amd64
  package-output-file:
    type: string
    default: deploy/lambda.zip
  cache-go-build:
    description: Cache the Go build cache between jobs. Disable for a project that does not vendor.
    type: boolean
    default: true
  go-cache-key-file:
    description: File whose checksum keys the Go build cache.
    type: string
    default: vendor/modules.txt

steps:
  - checkout
  - build:
      build-input-file: << parameters.build-input-file >>
      build-output-file: << parameters.build-output-file >>
      build-architecture: << parameters.build-architecture >>
      package-output-file: << parameters.package-output-file >>
      cache-go-build: << parameters.cache-go-build >>
      go-cache-key-file: << parameters.go-cache-key-file >>
  - notify:
      event: fail
      template: basic_fail_1
