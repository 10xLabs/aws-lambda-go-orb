description: >
  This job creates a module release

executor: << parameters.executor >>
resource_class: medium
parameters:
  executor:
    description: >
      Executor this job runs on. Override it to pin a different image tag, for
      example a specific Go or Node version.
    type: executor
    default: base
  module_name:
    type: string
  module_path:
    type: string

steps:
  - checkout
  - release-module:
      module_name: << parameters.module_name >>
      module_path: << parameters.module_path >>
  - notify:
      event: fail
      template: basic_fail_1
