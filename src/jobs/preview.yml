description: >
  This job create a preview of the Pulumi stack changes

executor: << parameters.executor >>
resource_class: medium
parameters:
  executor:
    description: >
      Executor this job runs on. Override it to pin a different image tag, for
      example a specific Go or Node version.
    type: executor
    default: node
  working-directory:
    type: string
    default: deploy
  stack-name:
    type: string
    default: ""
  install-pulumi-deps:
    type: boolean
    default: true
  setup-remote-docker:
    type: boolean
    default: false
  allow-destroy:
    description: >
      Let the preview pass when the plan deletes or replaces existing resources.
      Off by default: a deletion discards whatever the resource holds, and it is
      easy to miss in a long plan.
    type: boolean
    default: false

steps:
  - checkout
  - preview:
      working-directory: << parameters.working-directory >>
      stack-name: << parameters.stack-name >>
      install-pulumi-deps: << parameters.install-pulumi-deps >>
      setup-remote-docker: << parameters.setup-remote-docker >>
      allow-destroy: << parameters.allow-destroy >>
  - notify:
      event: fail
      template: basic_fail_1
