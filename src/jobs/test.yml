description: >
  This job run the AWS Lambda Go function tests

executor: << parameters.executor >>
resource_class: xlarge

parameters:
  executor:
    description: >
      Executor this job runs on. Override it to pin a different image tag, for
      example a specific Go or Node version.
    type: executor
    default: golang
  minimum-coverage:
    type: string
    default: "50.00"
  cache-go-build:
    description: Cache the Go build cache between jobs. Disable for a project that does not vendor.
    type: boolean
    default: true
  go-cache-key-file:
    description: File whose checksum keys the Go build cache.
    type: string
    default: vendor/modules.txt

steps:
  - checkout
  - test:
      minimum-coverage: << parameters.minimum-coverage >>
      cache-go-build: << parameters.cache-go-build >>
      go-cache-key-file: << parameters.go-cache-key-file >>
  - notify:
      event: fail
      template: basic_fail_1
