description: >
  Build, test, and deploy an AWS Lambda Go function with full CI/CD pipeline
usage:
  version: 2.1
  orbs:
    aws-lambda-go: nexbus/aws-lambda-go@3.25.3
  workflows:
    build-test-deploy:
      jobs:
        - aws-lambda-go/lint-code
        - aws-lambda-go/test:
            minimum-coverage: "80.00"
        - aws-lambda-go/build:
            requires:
              - aws-lambda-go/lint-code
              - aws-lambda-go/test
        - aws-lambda-go/deploy:
            requires:
              - aws-lambda-go/build
            filters:
              branches:
                only: master
